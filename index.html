
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STUDIO FLUX | AI Image Generator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #171a20;
      color: #f4f1eb;
      font-family: Inter, "Noto Sans TC", sans-serif;
    }

    header {
      padding: 24px 7%;
      border-bottom: 1px solid #343740;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .logo span { color: #c9a875; }

    .status {
      color: #c9a875;
      font-size: 11px;
      letter-spacing: 2px;
    }

    main {
      max-width: 1100px;
      margin: 55px auto;
      padding: 0 24px;
    }

    .hero { margin-bottom: 38px; }

    .eyebrow {
      color: #c9a875;
      letter-spacing: 3px;
      font-size: 12px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 54px);
      margin: 14px 0;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #a4a6ad;
      line-height: 1.8;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      background: #222630;
      border: 1px solid #383d47;
      border-radius: 12px;
      padding: 26px;
    }

    .section-title {
      font-size: 13px;
      color: #c9a875;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      margin: 18px 0 9px;
      color: #e4e1db;
    }

    textarea, input, select {
      width: 100%;
      background: #171a20;
      border: 1px solid #454a55;
      border-radius: 7px;
      padding: 13px;
      color: white;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.7;
    }

    textarea:focus, input:focus, select:focus {
      border-color: #c9a875;
    }

    .hint {
      color: #858995;
      font-size: 11px;
      line-height: 1.7;
      margin-top: 8px;
    }

    .preset-container {
      margin-top: 14px;
    }

    .preset-header {
      font-size: 11px;
      color: #a4a6ad;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preset-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .preset-btn {
      background: #171a20;
      border: 1px solid #454a55;
      color: #e4e1db;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .preset-btn:hover {
      border-color: #c9a875;
      color: #c9a875;
      background: rgba(201, 168, 117, 0.12);
      transform: translateY(-1px);
    }

    .preset-btn:active {
      transform: translateY(0);
    }

    .generate {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: 0;
      border-radius: 7px;
      background: #c9a875;
      color: #171a20;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .generate:hover { background: #dfc394; }
    .generate:disabled {
      opacity: .5;
      cursor: wait;
    }

    .preview {
      min-height: 390px;
      background: #171a20;
      border: 1px dashed #555b67;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
      padding: 16px;
    }

    .preview img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }

    .placeholder { color: #777d88; }

    .placeholder .symbol {
      font-size: 48px;
      margin-bottom: 14px;
      color: #c9a875;
    }

    #message {
      color: #c9a875;
      font-size: 12px;
      line-height: 1.7;
      margin-top: 15px;
      white-space: pre-wrap;
    }

    .download {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border: 1px solid #c9a875;
      border-radius: 6px;
      color: #c9a875;
      text-align: center;
      text-decoration: none;
    }

    footer {
      text-align: center;
      color: #747985;
      font-size: 11px;
      padding: 35px 15px;
      letter-spacing: 1px;
    }

    @media (max-width: 760px) {
      .workspace { grid-template-columns: 1fr; }
      header { padding: 20px; }
      main { margin: 35px auto; }
    }
  </style>
</head>

<body>
<header>
  <div class="logo">STUDIO <span>FLUX.</span></div>
  <div class="status">AI CREATIVE STUDIO</div>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">01 / IMAGE GENERATION</div>
    <h1>將想像，轉化為影像。</h1>
    <p class="subtitle">
      以文字描述創意，透過 FLUX.1-schnell
      將想法轉換成視覺作品。
    </p>
  </section>

  <div class="workspace">
    <section class="panel">
      <div class="section-title">CREATE YOUR IMAGE</div>


      <label for="prompt">圖片描述 Prompt</label>
      <textarea id="prompt"
        placeholder="例如：A luxury perfume bottle on a beige marble platform, soft studio lighting, premium commercial product photography..."></textarea>

      <div class="preset-container">
        <div class="preset-header">✧ 快速靈感標籤 (點擊填入)：</div>
        <div class="preset-tags">
          <button type="button" class="preset-btn" onclick="applyPreset('portrait')">📸 寫實人像</button>
          <button type="button" class="preset-btn" onclick="applyPreset('cyberpunk')">🌃 賽博龐克</button>
          <button type="button" class="preset-btn" onclick="applyPreset('product')">✨ 產品攝影</button>
          <button type="button" class="preset-btn" onclick="applyPreset('anime')">🎨 動漫風格</button>
          <button type="button" class="preset-btn" onclick="applyPreset('fantasy')">🌲 奇幻秘境</button>
          <button type="button" class="preset-btn" onclick="applyPreset('render3d')">🧸 3D 黏土</button>
        </div>
      </div>


      <button class="generate" id="generateBtn"
        onclick="generateImage()">
        ✦ GENERATE IMAGE
      </button>

      <div id="message">
        MODEL：FLUX.1-schnell
      </div>
    </section>

    <section class="panel">
      <div class="section-title">YOUR CREATION</div>

      <div class="preview" id="preview">
        <div class="placeholder">
          <div class="symbol">✧</div>
          <div>YOUR IMAGE WILL APPEAR HERE</div>
          <p class="hint">等待創意生成...</p>
        </div>
      </div>

      <a class="download" id="download"
        download="studio-flux-image.png">
        ↓ DOWNLOAD IMAGE
      </a>
    </section>
  </div>
</main>

<footer>
  STUDIO FLUX · POWERED BY BLACK FOREST LABS
  · FLUX.1-SCHNELL
</footer>


<script>
  const WORKER_URL =
    "https://falling-smoke-4d0bstudio-flux-api.wendy121888.workers.dev/generate";

  let currentImageUrl = null;

  async function generateImage() {
    const prompt = document.getElementById("prompt").value.trim();
    const button = document.getElementById("generateBtn");
    const message = document.getElementById("message");
    const preview = document.getElementById("preview");
    const download = document.getElementById("download");

    if (!prompt) {
      message.textContent = "請輸入圖片描述。";
      return;
    }

    button.disabled = true;
    button.textContent = "GENERATING...";
    message.textContent = "正在連接 STUDIO FLUX，請稍候...";
    download.style.display = "none";

    preview.innerHTML = `
      <div class="placeholder">
        <div class="symbol">✧</div>
        <div>CREATING YOUR IMAGE...</div>
        <p class="hint">AI 正在將文字轉換成影像</p>
      </div>
    `;

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ prompt })
      });

      if (!response.ok) {
        let errorMessage = "圖片生成失敗";
        try {
          const errorData = await response.json();
          errorMessage =
            errorData.detail ||
            errorData.error ||
            errorMessage;
        } catch (_) {}
        throw new Error(errorMessage);
      }

      const imageBlob = await response.blob();

      if (currentImageUrl) {
        URL.revokeObjectURL(currentImageUrl);
      }

      currentImageUrl = URL.createObjectURL(imageBlob);

      const img = document.createElement("img");
      img.src = currentImageUrl;
      img.alt = "STUDIO FLUX AI generated image";

      preview.replaceChildren(img);

      download.href = currentImageUrl;
      download.style.display = "block";

      message.textContent = "生成成功！你的作品已完成。";

    } catch (error) {
      console.error(error);

      preview.innerHTML = `
        <div class="placeholder">
          <div class="symbol">!</div>
          <div>GENERATION FAILED</div>
        </div>
      `;

      message.textContent =
        "生成失敗：" + (error.message || "未知錯誤") +
        "\n請稍後再試，或聯絡老師。";

    } finally {
      button.disabled = false;
      button.textContent = "✦ GENERATE IMAGE";
    }
  }

  const PRESETS = {
    portrait: "Close-up portrait of an elegant woman, soft cinematic studio lighting, highly detailed skin texture, 85mm portrait lens, shallow depth of field, photorealistic, 8k",
    cyberpunk: "Futuristic cyberpunk neon city street at night in rain, towering skyscrapers, holographic billboards, flying vehicles, reflections on wet asphalt, cinematic lighting, 8k",
    product: "A luxury perfume bottle on a polished beige marble platform, soft dramatic studio lighting, water splashes, premium commercial product photography, 8k resolution",
    anime: "Vibrant anime illustration of a magical girl with glowing hair standing on a floating island above clouds, Makoto Shinkai style, breathtaking sunset, detailed sky, masterpiece",
    fantasy: "An ancient glowing tree of life in a mystical enchanted forest, bioluminescent flora, fireflies, ethereal atmosphere, fantasy concept art, highly detailed, 8k",
    render3d: "Cute 3D isometric miniature diorama of a cozy coffee shop, pastel colors, blender 3d render, soft clay materials, warm ambient lighting, highly detailed"
  };

  function applyPreset(presetKey) {
    const promptInput = document.getElementById("prompt");
    const message = document.getElementById("message");
    if (PRESETS[presetKey]) {
      promptInput.value = PRESETS[presetKey];
      promptInput.focus();
      message.textContent = "已套用靈感提示詞！點擊「✦ GENERATE IMAGE」即可開始生成。";
    }
  }

  window.generateImage = generateImage;
  window.applyPreset = applyPreset;
</script>
</body>
</html>
